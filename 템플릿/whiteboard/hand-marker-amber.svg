<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900">
  <!-- 화이트보드 드로잉용 손+마커 (4색: 잉크 #141413 / 흰 채움 / 앰버 #F59E0B / 뉴트럴 #f7f6f4).
       펜촉이 좌상단(0,0) 근처에 오도록 배치 — 렌더러 tip_anchor=(0,0). -->
  <defs>
    <clipPath id="c"><rect width="640" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#c)" fill="none" stroke="#141413" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- 마커 몸통: 좌상단(펜촉) → 우하단 -->
    <g transform="translate(6,6) rotate(45)">
      <!-- 촉 -->
      <path d="M0 0 L26 -14 L26 14 Z" fill="#141413" stroke="#141413"/>
      <!-- 촉 받침 -->
      <rect x="26" y="-22" width="44" height="44" rx="6" fill="#141413"/>
      <!-- 몸통(앰버) -->
      <rect x="70" y="-34" width="470" height="68" rx="16" fill="#F59E0B"/>
      <!-- 몸통 하이라이트 -->
      <line x1="90" y1="-14" x2="500" y2="-14" stroke="#ffffff" stroke-width="6" opacity="0.55"/>
      <!-- 뒷캡 -->
      <rect x="540" y="-28" width="60" height="56" rx="12" fill="#141413"/>
    </g>
    <!-- 손: 마커 중간을 쥔 형태 (흰 채움 + 잉크 외곽) -->
    <!-- 손바닥/손등 -->
    <path d="M300 300 C 260 330, 250 400, 300 470 C 340 530, 420 560, 470 520 C 520 480, 520 380, 470 330 C 430 290, 350 270, 300 300 Z" fill="#ffffff"/>
    <!-- 검지 (마커 위를 누름) -->
    <path d="M300 300 C 260 260, 200 220, 170 200 C 150 190, 150 160, 175 158 C 200 156, 260 210, 320 270" fill="#ffffff"/>
    <!-- 엄지 (마커 아래를 받침) -->
    <path d="M330 470 C 290 450, 240 380, 220 340 C 208 316, 232 296, 254 312 C 290 340, 340 400, 380 430" fill="#ffffff"/>
    <!-- 중지·약지·소지 (접힘) -->
    <path d="M470 330 C 500 320, 540 340, 540 380 C 540 410, 500 420, 480 400" fill="#ffffff"/>
    <path d="M480 400 C 512 396, 548 420, 544 456 C 540 486, 500 492, 484 470" fill="#ffffff"/>
    <path d="M484 470 C 512 470, 540 494, 532 524 C 526 550, 494 552, 480 532" fill="#ffffff"/>
    <!-- 손목·팔 (우하단으로 빠짐) -->
    <path d="M330 520 C 360 620, 440 760, 520 900 L 640 900 L 640 760 C 590 680, 520 580, 470 520" fill="#ffffff"/>
    <!-- 소매 (뉴트럴) -->
    <path d="M478 780 C 520 740, 580 720, 640 730 L 640 900 L 520 900 C 500 860, 486 820, 478 780 Z" fill="#f7f6f4"/>
  </g>
</svg>
