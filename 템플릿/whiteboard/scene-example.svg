<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 화이트보드 드로잉 장면 예시 (16:9). 규칙:
       · 배경 흰색, 선은 잉크 #141413 (두께 6~10px), 채움은 앰버 #F59E0B / 그린 #16a34a / 뉴트럴 #f7f6f4 만.
       · 하단 21%(y > 853)는 자막 안전 영역 — 비워 둔다.
       · 그릴 순서 = <g data-wb="N">. data-wb-t="초"로 나레이션 실측 시각에 맞출 수 있다(전부 주거나 전부 생략).
       · 글자는 넣지 않는다(고유명사 로고도 텍스트 대신 도형). 텍스트는 자막·슬라이드 몫. -->
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g fill="none" stroke="#141413" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. 사람 (책상 앞, 고민) -->
    <g id="person" data-wb="1" data-wb-label="고민하는 사람">
      <circle cx="380" cy="300" r="70" fill="#ffffff"/>
      <path d="M300 620 C 300 480, 460 480, 460 620 Z" fill="#ffffff"/>
      <path d="M312 470 C 250 500, 240 580, 300 600"/>
      <path d="M448 470 C 520 500, 560 560, 600 540"/>
      <path d="M180 620 L 700 620 L 700 650 L 180 650 Z" fill="#f7f6f4"/>
      <path d="M470 175 c 20 -30 40 -30 60 -10 c 15 15 15 45 -5 55" stroke="#141413"/>
      <circle cx="530" cy="245" r="7" fill="#141413" stroke="none"/>
    </g>

    <!-- 2. 화살표 → 도구(노트북) -->
    <g id="arrow1" data-wb="2" data-wb-label="화살표">
      <path d="M720 430 L 900 430"/>
      <path d="M860 395 L 905 430 L 860 465"/>
    </g>
    <g id="laptop" data-wb="3" data-wb-label="노트북(AI)">
      <rect x="960" y="250" width="380" height="250" rx="18" fill="#ffffff"/>
      <rect x="990" y="280" width="320" height="190" rx="8" fill="#f7f6f4"/>
      <path d="M900 520 L 1400 520 L 1360 570 L 940 570 Z" fill="#ffffff"/>
      <!-- 화면 속 반짝(앰버) -->
      <path d="M1150 320 l 14 40 l 40 14 l -40 14 l -14 40 l -14 -40 l -40 -14 l 40 -14 Z" fill="#F59E0B" stroke="#141413"/>
      <path d="M1230 400 l 8 22 l 22 8 l -22 8 l -8 22 l -8 -22 l -22 -8 l 22 -8 Z" fill="#F59E0B" stroke="#141413"/>
    </g>

    <!-- 4. 화살표 → 결과(체크 문서) -->
    <g id="arrow2" data-wb="4" data-wb-label="화살표">
      <path d="M1440 430 L 1580 430"/>
      <path d="M1540 395 L 1585 430 L 1540 465"/>
    </g>
    <g id="result" data-wb="5" data-wb-label="완료 문서">
      <path d="M1640 240 L 1800 240 L 1860 300 L 1860 600 L 1640 600 Z" fill="#ffffff"/>
      <path d="M1800 240 L 1800 300 L 1860 300"/>
      <path d="M1680 360 L 1780 360 M1680 410 L 1800 410 M1680 460 L 1760 460"/>
      <circle cx="1810" cy="560" r="52" fill="#16a34a" stroke="#141413"/>
      <path d="M1782 560 L 1802 582 L 1840 538" stroke="#ffffff" stroke-width="10"/>
    </g>
  </g>
</svg>
